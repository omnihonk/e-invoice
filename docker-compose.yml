services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - MUSTANG_CLI_JAR=/app/Mustang-CLI-2.23.0.jar
    volumes:
      - ./data:/app/data
    network_mode: host
    depends_on:
      - redis

  redis:
    image: redis:alpine
    network_mode: host
