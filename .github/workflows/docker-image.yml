name: Docker Image CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

# Minimal permissions; packages:write only needed to push to GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in only when pushing (not on pull_request events)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build image and load it into the local Docker daemon for testing.
      # Uses GHA cache so repeated runs skip unchanged layers (esp. apt + JDK download).
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # load=true makes the image available to `docker run` below
          load: true
          tags: e-invoice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the full test suite inside the exact image that will be deployed.
      # Tests use the in-memory Redis fallback (no external service needed).
      - name: Run pytest inside Docker image
        run: |
          docker run --rm \
            -e MUSTANG_CLI_JAR=/app/Mustang-CLI-2.23.0.jar \
            --entrypoint python \
            e-invoice:ci \
            -m pytest

      # Derive image tags:
      #   • push to main  → :latest + :sha-<short> + :main
      #   • push of tag   → :latest + :<semver>  (e.g. v1.2.3 → 1.2.3)
      #   • pull_request  → build + test only, no push
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Re-build with push=true using the warm GHA cache — effectively instant.
      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
